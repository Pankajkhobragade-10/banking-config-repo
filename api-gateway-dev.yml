server:
  port: 8080

  spring:
    applocation:
      name: api-gateway

    security:
      oauth2:
        resourceserver:
          jwt:
            jwk-set-url: http://lacalhost:9000/oauth/jwks

         data:
           redis:
             host: localhost
             port: 6379

          cloud:
            gateway:
              default-filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

                  routes:
                    -id: account-service
                     url: Ib://ACCOUNT-SERVICE
                     predicates:
                       - Path=/api/accounts/**
                      filters:
                        - StripPrefix=1

                     - id: teansaction-service
                       url: lb://TRANSACTION-SERVICE
                       predication:
                         - Path=/api/transactions/**
                        filters:
                          - StripPrefix=1
                          - name: CircutBreaker
                            args:
                              name: transactionCB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

